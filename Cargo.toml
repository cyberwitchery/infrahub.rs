[workspace]
members = ["test-client"]

[package]
name = "infrahub"
version = "0.5.1"
edition = "2021"
license = "MIT"
description = "small graphql client for infrahub"
readme = "README.md"
repository = "https://github.com/cyberwitchery/infrahub.rs"
homepage = "https://github.com/cyberwitchery/infrahub.rs"
documentation = "https://docs.rs/infrahub"
exclude = ["sbom/", "unsafe-budget.lock"]

[dependencies]
reqwest = { version = "0.13", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
url = "2"
graphql-parser = { version = "0.4", optional = true }

[dev-dependencies]

[features]
default = []
codegen = ["dep:graphql-parser"]

[[bin]]
name = "infrahub-codegen"
path = "src/bin/infrahub-codegen.rs"
required-features = ["codegen"]
